# Coverage is uploaded by two workflows under two flags -- python from
# test-lib.yml, dotnet from test-lib-dotnet.yml -- and each runs only when its
# side changes. Carrying each flag forward keeps both badges on main showing a
# number when a commit ran only the other side.
flag_management:
  default_rules:
    carryforward: true

# The number is a badge and a trend, not a gate: nothing fails on it.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment: false
