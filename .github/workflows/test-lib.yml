name: Test Library

# Runs the Python library's test suite on Linux, macOS and Windows, with every
# Python version the library supports, on every push and pull request that touches
# it. One of those runs measures coverage for Codecov and the README badges.
# Releases are still built by the manual Build Library workflow (build-lib.yml).
on:
  push:
    paths:
      - 'dynaface-lib-python/**'
      - '.github/workflows/test-lib.yml'
  pull_request:
    paths:
      - 'dynaface-lib-python/**'
      - '.github/workflows/test-lib.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Lets the Codecov upload authenticate with GitHub's OIDC token, so no Codecov
  # token is stored in the repo.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The 3 ONNX models the tests need (the same zip models.download_models() fetches).
  MODELS_URL: https://data.heatonresearch.com/dynaface/model/2/dynaface_models.zip
  MODELS_SHA256: 8adc1246c00e8ea5a53e81e8000717b4541eabba59639ae178a07a799b5c57de
  # Draw charts without a display on every runner.
  MPLBACKEND: Agg

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Finish every combination, so one failure doesn't hide another.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Python 3.15 waits on onnxruntime, which has no 3.15 wheels yet.
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: dynaface-lib-python/setup.cfg

      - name: Install dependencies
        working-directory: dynaface-lib-python
        run: pip install -e ".[test]"

      # The cache key is shared with test-lib-dotnet.yml, so the ~400MB of models are
      # downloaded once per operating system rather than on every push. Having them
      # in place before the tests also keeps models.download_models()'s download path
      # from running, so coverage doesn't change with whether the cache hit.
      - name: Restore ONNX models
        id: models
        uses: actions/cache@v6
        with:
          path: ~/.dynaface/models
          key: dynaface-models-${{ runner.os }}-${{ env.MODELS_SHA256 }}

      - name: Download ONNX models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/dynaface_models.zip" "$MODELS_URL"
          # macOS has shasum but not sha256sum.
          if command -v sha256sum > /dev/null; then check=sha256sum; else check="shasum -a 256"; fi
          echo "$MODELS_SHA256  $RUNNER_TEMP/dynaface_models.zip" | $check -c -
          # unzip -d only creates the last directory level, and a fresh runner has no
          # ~/.dynaface.
          mkdir -p ~/.dynaface/models
          unzip -q "$RUNNER_TEMP/dynaface_models.zip" -d ~/.dynaface/models
          ls -l ~/.dynaface/models

      - name: Run tests
        working-directory: dynaface-lib-python
        run: |
          python -m pytest tests \
            --cov=dynaface --cov-branch \
            --cov-report=xml:coverage.xml \
            --cov-report=term

      # One upload keeps the badge comparable from run to run: Linux on Python 3.11
      # is what it has always measured.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: dynaface-lib-python/coverage.xml
          disable_search: true
          flags: python
          # A Codecov outage shouldn't turn the tests badge red.
          fail_ci_if_error: false
