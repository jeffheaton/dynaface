name: Build Library

# Builds the Python package for a release, by hand: static analysis reports,
# the suite with JUnit and coverage reports, a version file stamped with this
# build's date and number, then the wheel and sdist. twine checks them, the
# wheel is installed into an empty venv, and both are staged as an artifact
# and on S3 with a build record (dynaface-<version>-build.json: the commit,
# run and build number). Rerunning at the same version replaces what is
# staged. Publishing is a separate, manual step: Deploy Library to PyPI
# (deploy-lib.yml), which takes what this staged. RELEASING.md has the whole
# sequence.
on:
  workflow_dispatch:

permissions:
  contents: read
  # The JUnit report action publishes the test results as a check.
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install build tools
        run: python -m pip install build twine

      - name: Install dependencies
        working-directory: dynaface-lib-python
        run: pip install -e ".[test,lint]"

      # setup.cfg's [metadata] version is the one this build stamps, packs and
      # records.
      - name: Read the version
        working-directory: dynaface-lib-python
        run: |
          VERSION=$(python -c "import configparser; c = configparser.ConfigParser(); c.read('setup.cfg'); print(c['metadata']['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building dynaface $VERSION"

      # Reports, not gates: each is uploaded for reading.
      - name: Static code analysis
        working-directory: dynaface-lib-python
        run: |
          echo "Running flake8..."
          flake8 dynaface --config "$GITHUB_WORKSPACE/.flake8" --output-file=flake8-report.txt || true

          echo "Running mypy..."
          mypy --install-types --non-interactive || true
          mypy dynaface --show-error-codes --no-color-output --no-error-summary > mypy-report.txt || true

          echo "Running bandit..."
          bandit -r dynaface -f txt -o bandit-report.txt || true

          echo "Checking formatting with black..."
          black --check dynaface > black-report.txt 2>&1 || true

          echo "Checking imports with isort..."
          isort dynaface --check-only > isort-report.txt || true

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-reports
          retention-days: 7
          path: dynaface-lib-python/*.txt
          if-no-files-found: ignore

      - name: Run tests
        working-directory: dynaface-lib-python
        run: |
          python -m pytest tests \
            --junitxml=unit_test_results.xml \
            --cov=dynaface --cov-branch \
            --cov-report=xml:coverage.xml \
            --cov-report=html \
            --cov-report=term

      # Reported, not enforced, from the coverage the run above measured.
      - name: Check coverage threshold
        working-directory: dynaface-lib-python
        continue-on-error: true
        run: python -m coverage report --fail-under=60 > /dev/null

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: dynaface-lib-python/unit_test_results.xml

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          retention-days: 7
          path: |
            dynaface-lib-python/coverage.xml
            dynaface-lib-python/htmlcov/
          if-no-files-found: ignore

      - name: Generate version file
        working-directory: dynaface-lib-python
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S%z")
          BUILD="${{ github.run_number }}"

          cat <<EOF > dynaface/version.py
          # Note, this file is auto-generated by the build process.
          VERSION = "$VERSION"
          BUILD_DATE = "$BUILD_DATE"
          BUILD = $BUILD
          EOF

          echo "Generated dynaface/version.py:"
          cat dynaface/version.py

      # MANIFEST.in prunes tests/ from the sdist: the tests need tests_data/,
      # which it leaves out.
      - name: Build the wheel and sdist
        working-directory: dynaface-lib-python
        run: |
          rm -rf dist
          python -m build
          ls -l dist

      - name: Validate with twine
        working-directory: dynaface-lib-python
        run: python -m twine check --strict dist/*

      # The wheel installs with its dependencies into an empty venv, imports
      # the analysis and the measures, and reports the version it was built
      # at, from outside the checkout, so nothing is read from the source tree
      # by accident. (dynaface.version is imported as a module: the package
      # binds the name "version" to importlib.metadata's function.)
      - name: Install the wheel and try it
        working-directory: dynaface-lib-python
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install "dist/dynaface-$VERSION-py3-none-any.whl"
          cd "$RUNNER_TEMP"
          smoke/bin/python - <<'EOF'
          import os

          import dynaface
          import dynaface.facial
          import dynaface.measures
          import dynaface.version as stamped

          print(dynaface.__version__, stamped.VERSION, stamped.BUILD_DATE, stamped.BUILD)
          assert dynaface.__file__.startswith(os.environ["RUNNER_TEMP"]), dynaface.__file__
          assert dynaface.__version__ == os.environ["VERSION"], dynaface.__version__
          assert stamped.VERSION == os.environ["VERSION"], stamped.VERSION
          assert stamped.BUILD == int(os.environ["GITHUB_RUN_NUMBER"]), stamped.BUILD
          assert dynaface.measures.all_measures()
          EOF

      # What deploy-lib.yml tags: the commit these files were built from.
      - name: Record the build
        working-directory: dynaface-lib-python
        run: |
          python - <<'EOF' > "dist/dynaface-$VERSION-build.json"
          import datetime, json, os
          print(json.dumps({
              "name": "dynaface",
              "version": os.environ["VERSION"],
              "commit": os.environ["GITHUB_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_number": int(os.environ["GITHUB_RUN_NUMBER"]),
              "built": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }, indent=2))
          EOF
          cat "dist/dynaface-$VERSION-build.json"

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: dynaface-dist
          retention-days: 7
          path: dynaface-lib-python/dist/*

      # Staged where Deploy Library to PyPI looks for them, by version.
      - name: Upload to S3
        working-directory: dynaface-lib-python
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          for f in "dist/dynaface-$VERSION-py3-none-any.whl" "dist/dynaface-$VERSION.tar.gz" "dist/dynaface-$VERSION-build.json"; do
            aws s3 cp "$f" s3://data.heatonresearch.com/library/ --acl public-read
          done

      - name: Clean up build artifacts
        if: always()
        working-directory: dynaface-lib-python
        run: rm -rf build dist dynaface.egg-info htmlcov
