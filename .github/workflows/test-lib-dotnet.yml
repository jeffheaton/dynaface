name: Test Library (.NET)

# Runs the .NET library's test suite with coverage on every push and pull request
# that touches it, and uploads the coverage to Codecov for the README badges.
# Releases are still built by the manual Build Library (.NET) workflow
# (build-lib-dotnet.yml).
on:
  push:
    paths:
      - 'dynaface-lib-dotnet/**'
      - '.github/workflows/test-lib-dotnet.yml'
  pull_request:
    paths:
      - 'dynaface-lib-dotnet/**'
      - '.github/workflows/test-lib-dotnet.yml'
  workflow_dispatch:

permissions:
  contents: read
  # Lets the Codecov upload authenticate with GitHub's OIDC token, so no Codecov
  # token is stored in the repo.
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The 3 ONNX models the integration tests need (same zip dynaface-lib downloads).
  MODELS_URL: https://data.heatonresearch.com/dynaface/model/2/dynaface_models.zip
  MODELS_SHA256: 8adc1246c00e8ea5a53e81e8000717b4541eabba59639ae178a07a799b5c57de

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The cache key is shared with test-lib.yml, so the ~400MB of models are
      # downloaded once rather than on every push. ~/.dynaface/models is one of the
      # places DynafaceTests/ModelPathResolver.cs looks by default.
      - name: Restore ONNX models
        id: models
        uses: actions/cache@v6
        with:
          path: ~/.dynaface/models
          key: dynaface-models-${{ env.MODELS_SHA256 }}

      - name: Download ONNX models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/dynaface_models.zip" "$MODELS_URL"
          echo "$MODELS_SHA256  $RUNNER_TEMP/dynaface_models.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/dynaface_models.zip" -d ~/.dynaface/models
          ls -l ~/.dynaface/models

      # DYNAFACE_REQUIRE_MODELS makes the model-gated integration tests fail rather
      # than skip if the models can't be loaded; without them, coverage would quietly
      # drop to the unit tests alone. See DynafaceTests/ModelFixture.cs. Coverage
      # leaves out the FacialDllConsole example, which isn't part of the packages.
      - name: Run tests
        working-directory: dynaface-lib-dotnet
        env:
          DYNAFACE_REQUIRE_MODELS: '1'
        run: |
          dotnet test DynafaceTests/DynafaceTests.csproj \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[FacialDllConsole]*"
          cp TestResults/*/coverage.cobertura.xml coverage.cobertura.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: dynaface-lib-dotnet/coverage.cobertura.xml
          disable_search: true
          flags: dotnet
          # A Codecov outage shouldn't turn the tests badge red.
          fail_ci_if_error: false
