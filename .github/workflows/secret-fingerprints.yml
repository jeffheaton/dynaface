# Diagnostic: print short SHA-256 fingerprints (first 12 hex digits) of the
# high-entropy eSigner secrets so their values can be compared with another
# repo's copies without revealing them. Deliberately excludes the password and
# username. Manual trigger only.
name: secret-fingerprints

on:
  workflow_dispatch:

jobs:
  fingerprints:
    runs-on: ubuntu-latest
    steps:
      - name: Fingerprint the TOTP secret and credential id
        env:
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
          SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
        run: |
          for n in SSL_COM_TOTP_SECRET SSL_COM_CREDENTIAL_ID; do
            v="${!n}"
            fp=$(printf '%s' "$v" | sha256sum | cut -c1-12)
            echo "$n: length ${#v}, sha256 prefix $fp"
          done
