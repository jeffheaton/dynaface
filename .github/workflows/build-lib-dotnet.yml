name: Build Library (.NET)

on:
  workflow_dispatch:

# Builds, tests and uploads to S3 only. Publishing to NuGet.org is a separate,
# manual step: the Deploy Library to NuGet (.NET) workflow (deploy-lib-dotnet.yml).
permissions:
  contents: read
  checks: write

env:
  # The 3 ONNX models the integration tests need (same zip dynaface-lib downloads).
  MODELS_URL: https://data.heatonresearch.com/dynaface/model/2/dynaface_models.zip
  MODELS_SHA256: 8adc1246c00e8ea5a53e81e8000717b4541eabba59639ae178a07a799b5c57de

jobs:
  # Runs the suite with no models, to prove the model-gated tests are reported as
  # Skipped (not silently passed) and that everything else still passes without them.
  test-without-models:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests without models
        working-directory: dynaface-lib-dotnet
        env:
          # Authoritative when set, so pointing it at an empty folder means no models.
          DYNAFACE_ONNX_MODELS: ${{ runner.temp }}/no-models
        run: |
          mkdir -p "$DYNAFACE_ONNX_MODELS"
          dotnet test DynafaceTests/DynafaceTests.csproj -c Release \
            --logger "trx;LogFileName=test_results.trx" \
            --results-directory TestResults

      - name: Check the model-gated tests were skipped
        working-directory: dynaface-lib-dotnet
        run: |
          SKIPPED=$(grep -o 'outcome="NotExecuted"' TestResults/test_results.trx | wc -l)
          echo "Skipped tests: $SKIPPED"
          if [ "$SKIPPED" -eq 0 ]; then
            echo "::error::Expected the model-gated tests to be skipped without models."
            exit 1
          fi

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: .NET Test Results (no models)
          path: dynaface-lib-dotnet/TestResults/*.trx
          reporter: dotnet-trx

  build:
    needs: test-without-models
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: dynaface-lib-dotnet
        run: dotnet restore FacialDll.sln

      - name: Check formatting
        working-directory: dynaface-lib-dotnet
        run: dotnet format FacialDll.sln --verify-no-changes --report format-report

      - name: Upload formatting report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: format-report
          retention-days: 7
          path: dynaface-lib-dotnet/format-report
          if-no-files-found: ignore

      - name: Check for vulnerable packages
        working-directory: dynaface-lib-dotnet
        continue-on-error: true
        run: dotnet list DynafaceTests/DynafaceTests.csproj package --vulnerable --include-transitive | tee vulnerable-packages-report.txt

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vulnerability-report
          retention-days: 7
          path: dynaface-lib-dotnet/vulnerable-packages-report.txt
          if-no-files-found: ignore

      - name: Generate version file
        working-directory: dynaface-lib-dotnet
        run: |
          VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' facial_dll/FacialDll.csproj)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S%z")
          BUILD="${{ github.run_number }}"

          cat <<EOF > facial_dll/Version.cs
          // Note, this file is auto-generated by the build process.
          public static class DynafaceVersion
          {
              public const string Version = "$VERSION";
              public const string BuildDate = "$BUILD_DATE";
              public const int Build = $BUILD;
          }
          EOF

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Generated facial_dll/Version.cs:"
          cat facial_dll/Version.cs

      - name: Build (Release)
        working-directory: dynaface-lib-dotnet
        run: dotnet build FacialDll.sln -c Release --no-restore -p:Version=$VERSION

      - name: Download ONNX models
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/dynaface_models.zip" "$MODELS_URL"
          echo "$MODELS_SHA256  $RUNNER_TEMP/dynaface_models.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/dynaface_models.zip" -d "$RUNNER_TEMP/models"
          ls -l "$RUNNER_TEMP/models"

      # DYNAFACE_REQUIRE_MODELS makes the model-gated integration tests fail rather
      # than skip if the models can't be loaded, so nothing is published unless they
      # actually ran. See DynafaceTests/ModelFixture.cs.
      - name: Run tests
        working-directory: dynaface-lib-dotnet
        env:
          DYNAFACE_ONNX_MODELS: ${{ runner.temp }}/models
          DYNAFACE_REQUIRE_MODELS: '1'
        run: |
          dotnet test DynafaceTests/DynafaceTests.csproj -c Release --no-build \
            --logger "trx;LogFileName=test_results.trx" \
            --results-directory TestResults

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: .NET Test Results
          path: dynaface-lib-dotnet/TestResults/*.trx
          reporter: dotnet-trx

      - name: Package library artifact
        working-directory: dynaface-lib-dotnet
        run: |
          mkdir -p dist
          cp facial_dll/bin/Release/netstandard2.1/Dynaface.dll dist/
          cp facial_dll/bin/Release/netstandard2.1/Dynaface.pdb dist/ 2>/dev/null || true
          cd dist && zip -r "../dynaface-dotnet-${VERSION}.zip" .

      - name: Upload library artifact
        uses: actions/upload-artifact@v7
        with:
          name: dynaface-dotnet-dll
          retention-days: 7
          path: dynaface-lib-dotnet/dynaface-dotnet-*.zip

      - name: Upload to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          aws s3 cp dynaface-lib-dotnet/dynaface-dotnet-${VERSION}.zip s3://data.heatonresearch.com/library/ --acl public-read

      - name: Pack NuGet packages (Dynaface + Dynaface.Onnx)
        working-directory: dynaface-lib-dotnet
        run: |
          dotnet pack facial_dll/FacialDll.csproj -c Release --no-build \
            -p:Version=$VERSION -o nupkgs
          dotnet pack FacialDll.Onnx/FacialDll.Onnx.csproj -c Release --no-build \
            -p:Version=$VERSION -o nupkgs
          ls -l nupkgs

      - name: Upload NuGet packages artifact
        uses: actions/upload-artifact@v7
        with:
          name: dynaface-nupkgs
          retention-days: 7
          path: dynaface-lib-dotnet/nupkgs/*.nupkg

      - name: Upload NuGet packages to S3
        working-directory: dynaface-lib-dotnet
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        run: |
          for f in nupkgs/*.nupkg; do
            aws s3 cp "$f" s3://data.heatonresearch.com/library/ --acl public-read
          done

      - name: Clean up build artifacts
        if: always()
        working-directory: dynaface-lib-dotnet
        run: rm -rf dist nupkgs TestResults format-report facial_dll/bin facial_dll/obj FacialDll.Onnx/bin FacialDll.Onnx/obj FacialDllConsole/bin FacialDllConsole/obj DynafaceTests/bin DynafaceTests/obj
